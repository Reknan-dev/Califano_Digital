<script>

  // ── Menu fullscreen overlay ──────────────────────────────────

  const menuOverlay = document.getElementById('menu-overlay');
  const menuBackdrop = document.getElementById('menu-backdrop');
  const hamburger = document.querySelector('.navbar__hamburger');
  const negative_hamburger = document.querySelector('.navbar__hamburger-white ')

  function openMenu() {
    menuOverlay.classList.add('is-open');
    menuBackdrop.classList.add('is-open');
    menuOverlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden'; // blocca scroll pagina
  }

  function closeMenu() {
    menuOverlay.classList.remove('is-open');
    menuBackdrop.classList.remove('is-open');
    menuOverlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  // Apri al click sull'hamburger
  hamburger.addEventListener('click', openMenu);

  // Chiudi con il tasto X
  negative_hamburger.addEventListener('click', closeMenu);

  // Chiudi cliccando fuori (backdrop)
  menuBackdrop.addEventListener('click', closeMenu);

  // Chiudi con ESC
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMenu();
  });

  // Chiudi al click su una voce del menu (smooth scroll)
  document.querySelectorAll('.menu-nav__item').forEach(item => {
    item.addEventListener('click', () => closeMenu());
  });

  // ── Pillole espandibili (Strategia / Contenuti / Crescita) ──
  document.querySelectorAll('.services__pills .pill').forEach(pill => {
    pill.addEventListener('click', () => {
      pill.classList.toggle('pill--active');
    });
  });

  document.querySelectorAll('.filter-box input[type="radio"]').forEach(radio => {
  radio.addEventListener('click', function () {
    if (this._wasChecked) {
      this.checked = false;
      this._wasChecked = false;
    } else {
      document.querySelectorAll(`input[name="${this.name}"]`).forEach(r => r._wasChecked = false);
      this._wasChecked = true;
    }
  });
});
</script>
